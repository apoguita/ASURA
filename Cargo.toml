[workspace]
resolver = "2"
members = [
    "crates/asura-auth",
    "crates/asura-world",
    "crates/asura-protocol",
    "crates/asura-db",
    "crates/asura-fakeworld",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Added with the code that needs them (docs/adr/0007-rust-translation.md): M2 needs a database, so
# the database and runtime dependencies arrive with placement. Networking arrives with the services.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
uuid = { version = "1", features = ["v4"] }
