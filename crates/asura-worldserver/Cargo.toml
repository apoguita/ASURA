[package]
name = "asura-worldserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The world program, built in the reference server's shape"

[dependencies]
asura-config = { path = "../asura-config" }
asura-db = { path = "../asura-db" }
asura-protocol = { path = "../asura-protocol" }
asura-rules = { path = "../asura-rules" }
asura-store = { path = "../asura-store" }
sqlx = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[features]
# The measuring instruments (capture, replay), off in a serving build - D32.
harness = []

# The lints arrive with the cleanup, not with the move: the crate this code came from had none, and
# opting in here would turn a move into a rewrite. Phase 4 closes by adding this back.
[dev-dependencies]
tokio = { workspace = true }
# The acceptance tests start the world the way the supervisor does and speak the protocol through the
# fake client, which the wire layer compiles only on request (D13).
asura-auth = { path = "../asura-auth" }
asura-gateway = { path = "../asura-gateway" }
asura-protocol = { path = "../asura-protocol", features = ["test-client"] }